name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Skip Electron binary download
        run: echo "ELECTRON_SKIP_BINARY_DOWNLOAD=1" >> "$GITHUB_ENV"

      - name: Prepare env file
        run: |
          # 没有现成 .env.local 就用示例配置兜底（在线音源 API 为空不影响编译）
          [ -f .env.local ] || cp .env.example .env.local

      - name: Install dependencies
        run: npm install

      - name: Build web bundle + sync to Capacitor
        run: npm run cap:sync:android

      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > android/app/folia-release.keystore
          {
            echo "storeFile=folia-release.keystore"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=folia"
            echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}"
          } > android/keystore.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: folia-sonnet-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
